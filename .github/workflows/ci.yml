name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous runs on the same branch / PR when a new one starts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests

  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Must match `python_version` in [tool.mypy]. On 3.12 pip resolves a
          # numpy whose stubs use PEP 695 `type` statements, which mypy refuses
          # to parse while targeting 3.10 ("Type statement is only supported in
          # Python 3.12 and greater") — it aborts before checking our code.
          python-version: "3.10"
          cache: pip
      # mypy needs the onnx types in scope. `typecheck` additionally pins
      # torch/torchvision -- mypy input, see the extra in pyproject.toml. The
      # test matrix below deliberately omits it.
      - run: pip install -e '.[dev,typecheck,openvino]'
      - run: mypy

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[dev,openvino]'
      # onnxruntime is intentionally not in `[onnx]` (CPU vs GPU wheels
      # differ); install the CPU build explicitly so the `onnx`-marked
      # tests can actually run.
      - run: pip install onnxruntime
      # Skip what needs hardware we don't have here (cuda / multi_gpu: no
      # NVIDIA GPU; mps: no Apple Silicon) and the slow job's tests.
      - run: >
          pytest
          -m "not cuda and not mps and not multi_gpu and not slow"
          --cov=mayaku
          --cov-report=term-missing

  # The overfit gates, the tiny training runs, every tier's fuse parity and
  # the two-rank DDP helpers: minutes on CPU, so only once the fast checks pass.
  test-slow:
    name: Test (slow)
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev,openvino]'
      - run: pip install onnxruntime
      - run: >
          pytest
          -m "slow and not cuda and not mps and not multi_gpu"

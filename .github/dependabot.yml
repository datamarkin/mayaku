# Keeps the pinned lint/type toolchain fresh without letting it drift.
#
# `[project.optional-dependencies].dev` pins ruff, mypy and the typeshed stubs
# exactly, because their *diagnostics* change between releases: an unpinned
# floor means CI resolves the newest on every run while a developer machine
# stays wherever it was installed, and the two then disagree about code neither
# of them touched. Pinning fixes that but goes stale.
#
# Dependabot is what un-stales it. A bump arrives as its own PR, so the new
# release's diagnostics show up in isolation — reviewable, and fixable in the
# same PR — instead of landing on whoever happens to push a feature that day.
version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR for the whole toolchain: these are upgraded together or not at all,
    # and a single "bump lint tooling" PR is easier to review than four.
    groups:
      lint-and-types:
        patterns:
          - "ruff"
          - "mypy"
          - "types-*"
      # Its own group, not folded into the one above: torch is pinned for the
      # same reason (its inline annotations are mypy input, see the `typecheck`
      # extra) but ships on its own cadence, and a torch bump is a far bigger
      # review surface than a ruff patch. Fusing the two would recreate exactly
      # the non-isolation this file exists to prevent.
      typecheck-torch:
        patterns:
          - "torch"
          - "torchvision"
    open-pull-requests-limit: 5

  # Action versions drift the same way and break the same jobs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mayaku"
dynamic = ["version"]
description = "Real-time detection, segmentation and keypoints that deploy on any accelerator."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    {name = "Emrah Nazif", email = "emrah@datamarkin.com"},
    {name = "Datamarkin", email = "support@datamarkin.com"}
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
]
dependencies = [
  "torch>=2.4",
  "torchvision>=0.19",
  "numpy>=1.26",
  "opencv-python-headless>=4.8",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "pycocotools>=2.0.7",
]

[project.optional-dependencies]
# onnxruntime is intentionally not pinned here: CPU and CUDA hosts need
# different wheels (onnxruntime vs onnxruntime-gpu). Install manually:
#   CPU / Apple Silicon:  pip install onnxruntime
#   CUDA Linux/Windows:   pip install onnxruntime-gpu
# The CLI reports the right install command if the package is missing.
onnx = ["onnx>=1.16"]

# The lint/type toolchain is PINNED, not floored. ruff and mypy change their
# diagnostics between releases, and typeshed stubs change whether a third-party
# call counts as typed — so an unpinned floor means CI resolves the newest on
# every run while a developer machine stays wherever it was installed, and the
# two disagree about code neither of them changed. Bump these deliberately.
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff==0.16.5",
  "mypy==2.3.1",
  "types-PyYAML==6.0.12.20260815",
]

# Same pin-don't-floor reason as `dev` above, extended to what mypy actually
# reads: torch ships `py.typed`, so its inline annotations are mypy input
# exactly like typeshed is, and pinning the checker but not torch pins half the
# input. Separate from `dev` on purpose — the test matrix must keep resolving
# current torch, which is what the `>=` floor is for.
typecheck = [
  "torch==2.14.0",
  "torchvision==0.29.0",
]

[project.scripts]
mayaku = "mayaku.cli.__main__:app"

[project.urls]
Homepage = "https://github.com/datamarkin/mayaku"

[tool.hatch.version]
path = "src/mayaku/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mayaku"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM",           # simplify
  "RUF",
]
ignore = [
  "E501",  # line length handled by formatter
  # The codebase uses real Unicode glyphs (× for multiplication, – for
  # en-dash) in prose docstrings and comments — they read better than
  # ASCII substitutes. We don't put them in identifiers, so the
  # ambiguity ruff is guarding against doesn't apply.
  "RUF002", "RUF003",
  # printf-style formatting is the house style of the training and model
  # code's log lines; f-strings are not more correct, only different.
  "UP031",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
# Typer's idiom puts function calls in argument defaults; that's the
# whole point of `typer.Argument(...)` / `typer.Option(...)` and
# matches the official examples.
"src/mayaku/cli/__main__.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
# Two relaxations of `strict`, both for the same reason: torch is only partly
# annotated. `no-untyped-call` fires solely at call sites into torch's bare
# internals — our own code is annotated, so the code says nothing about mayaku
# and only yields ignore comments that expire the day torch annotates the
# function under them. Global is the only scope that works: per-module settings
# match where the error is *reported*, which for this code is always `mayaku.*`.
disallow_untyped_decorators = false  # torch decorators are untyped
disable_error_code = ["no-untyped-call"]
files = ["src/mayaku"]

[[tool.mypy.overrides]]
module = [
  "torchvision.*",
  "pycocotools.*",
  "coremltools.*",
  "openvino.*",
  "onnxruntime.*",
  "tensorrt.*",
]
ignore_missing_imports = true

# The numerical core -- the network, the data pipeline, the loss and the
# training loop, and the host decode -- is written in the unannotated style of
# the research code it came from, where the tensor shapes in the docstrings
# say more than `Tensor` annotations would. Annotated definitions there are
# checked as strictly as anywhere; unannotated ones are left to the tests.
[[tool.mypy.overrides]]
module = [
  "mayaku.model.*",
  "mayaku.data.*",
  "mayaku.engine.*",
  "mayaku.inference.decode",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
check_untyped_defs = false

# torch.amp re-exports its public surface via plain `from .x import y`
# (no `as y`), which trips mypy's no_implicit_reexport. Allow it for torch.
[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
implicit_reexport = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "cuda: requires a CUDA device",
  "mps: requires an Apple-Silicon MPS device",
  "multi_gpu: requires >= 2 CUDA devices",
  "slow: long-running test",
]
filterwarnings = [
  # pycocotools' __array__ doesn't accept numpy 2's `copy=` kwarg.
  # Correctness unaffected — the fallback still produces the right
  # bitmap. Scoped to the pycocotools module so any genuine numpy-2
  # warning from our own code still surfaces. Upstream fix tracked in
  # cocodataset/cocoapi.
  "ignore:.*__array__ implementation.*:DeprecationWarning:pycocotools.*",
  # We pin `dynamo=False` in ONNXExporter to avoid the new exporter's
  # `onnxscript` dep; PyTorch warns that the legacy path will go
  # away "starting in PyTorch 2.9". Revisit when we adopt the dynamo
  # path (will need `onnxscript` in `[onnx]`).
  "ignore:You are using the legacy TorchScript-based ONNX export:DeprecationWarning",
  "ignore:The feature will be removed:DeprecationWarning:torch.onnx.*",
]
